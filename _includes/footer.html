<!-- Footer -->
<footer class="text-center">
  <div class="footer-above">
    <div class="container">
      <div class="row">
        <div class="footer-col col-md-4">
          <h3>{{ t.location }}</h3>
          <p>
            {{ t.address }}
          </p>
        </div>
        <div class="footer-col col-md-4">
          <h3>{{ t.social }}</h3>
          <ul class="list-inline">
            {% for network in site.social %}
            <li>
              <a href="{{ network.url }}" class="btn-social btn-outline" aria-label="{{ network.title | escape }}"><i
                  class="fa-brands fa-fw fa-{{ network.title }}" aria-hidden="true"></i></a>
            </li>
            {% endfor %}
          </ul>
        </div>
        <div class="footer-col col-md-4">
          <h3>{{ t.credits }}</h3>
          <p>{{ t.credit_text }}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="footer-below">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          Copyright &copy; {{ site.footer.copyright }} {{ site.time | date: '%Y' }}
        </div>
      </div>
    </div>
  </div>
</footer>

<!-- Scroll to Top Button (Only visible on small and extra-small screen sizes) -->
<div class="scroll-top page-scroll visible-xs visible-sm">
  <a class="btn btn-primary" href="#page-top" aria-label="{{ t.top }}">
    <i class="fa fa-chevron-up"></i>
  </a>
</div>
